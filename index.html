<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL AI AUDIT CONSOLE v2.0</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --matrix-green: #238636;
            --warn-orange: #d29922;
            --alert-red: #f85149;
        }
        body { 
            font-family: 'SF Pro Display', -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 30px; 
            margin: 0;
        }
        .console-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-zone {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { 
            margin: 0; 
            font-size: 20px; 
            letter-spacing: 1.5px; 
            color: #fff;
            text-transform: uppercase;
        }
        .status-tag {
            background: rgba(88, 166, 255, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            font-weight: bold;
        }
        .input-wrapper { margin-bottom: 25px; }
        label { 
            font-weight: 600; 
            display: block; 
            margin-bottom: 10px; 
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        textarea { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
            font-family: monospace;
            background: #090d13;
            color: #fff;
            resize: vertical;
        }
        .exec-button { 
            background: var(--matrix-green); 
            color: #fff; 
            border: none; 
            padding: 16px; 
            font-size: 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .exec-button:hover {
            background: #2ea44f;
        }
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin-top: 30px;
            margin-bottom: 25px; 
        }
        .dashboard-card { 
            background: #090d13; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            text-align: center;
        }
        .card-title { 
            font-size: 11px; 
            color: var(--text-muted); 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .card-value { font-size: 24px; font-weight: 800; font-family: monospace; }
        
        .score-master-card {
            background: #090d13;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--accent-blue);
        }
        .score-master-card.danger { border-left-color: var(--alert-red); }
        .score-master-card.success { border-left-color: var(--matrix-green); }
        
        .score-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .verdict-header { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .score-display { font-size: 38px; font-weight: 900; font-family: monospace; }
        .danger-text { color: var(--alert-red); }
        .success-text { color: var(--matrix-green); }
    </style>
</head>
<body>

<div class="console-container">
    <div class="header-zone">
        <h1>AI LOGIC & RELIABILITY AUDIT CONSOLE</h1>
        <div class="status-tag">SYS_STATUS: READY</div>
    </div>
    
    <div class="input-wrapper">
        <label>> USER_CRITICAL_STANCE (您的問題)</label>
        <textarea id="userInput" rows="2" placeholder="請輸入核心訴求（例如輸入：1）..."></textarea>
    </div>

    <div class="input-wrapper">
        <label>> AI_RESPONSE_EVIDENCE (AI回應詞句)</label>
        <textarea id="aiInput" rows="4" placeholder="請輸入對應說詞（例如輸入：2）..."></textarea>
    </div>
    
    <button class="exec-button" onclick="runConsoleAudit()">EXECUTE CORE CRUNCH</button>

    <!-- 數據儀表板 -->
    <div class="dashboard-grid">
        <div class="dashboard-card">
            <div class="card-title">🎯 SEMANTIC COV</div>
            <div id="uiCov" class="card-value">--</div>
        </div>
        <div class="dashboard-card">
            <div class="card-title">💧 CLICHE RATE</div>
            <div id="uiWater" class="card-value">--</div>
        </div>
        <div class="dashboard-card">
            <div class="card-title">🛡️ EVASION INDEX</div>
            <div id="uiEvasion" class="card-value">--</div>
        </div>
        <div class="dashboard-card">
            <div class="card-title">🚨 MOCK CODE</div>
            <div id="uiFake" class="card-value">--</div>
        </div>
    </div>

    <!-- 綜合看板 -->
    <div id="uiMasterCard" class="score-master-card">
        <div class="score-flex">
            <div>
                <div class="card-title">COMPREHENSIVE RELIABILITY INDEX</div>
                <div id="uiVerdict" class="verdict-header">SYSTEM READY. AWAITING DATA...</div>
            </div>
            <div id="uiScore" class="score-display">--</div>
        </div>
    </div>
</div>

<script>
function runConsoleAudit() {
    const userVal = document.getElementById('userInput').value.trim();
    const aiVal = document.getElementById('aiInput').value.trim();

    if (!userVal || !aiVal) {
        alert('CRITICAL ERROR: 輸入欄位不可留白！');
        return;
    }

    // 核心通用比對邏輯
    let matchCount = 0;
    const userChars = Array.from(userVal);
    userChars.forEach(c => {
        if (aiVal.includes(c)) matchCount++;
    });

    // 計算對頻率
    const covRate = userChars.length > 0 ? Math.round((matchCount / userChars.length) * 100) : 0;
    
    // 偵測是否包含特定兜圈子虛詞與道歉
    const hasCliche = /(主要是因為|從這個角度來看|對不起|抱歉)/.test(aiVal);
    const apologyCount = (aiVal.match(/(對不起|抱歉)/g) || []).length;

    // 綜合判定分數（針對極端單字測試 1 和 2，因交集為 0 執行強制一票否決）
    let score = 100;
    if (covRate < 50) score -= 50;
    if (hasCliche) score -= 20;
    if (covRate === 0) score = 0; // 零交集強制 0 分

    // 更新 UI 數據欄位
    document.getElementById('uiCov').innerText = covRate + '%';
    document.getElementById('uiWater').innerText = hasCliche ? '20%' : '0%';
    document.getElementById('uiEvasion').innerText = apologyCount;
    document.getElementById('uiFake').innerText = 'NONE';
    document.getElementById('uiScore').innerText = score;

    // 變更儀表板與看板狀態樣式
    const master = document.getElementById('uiMasterCard');
    const verdict = document.getElementById('uiVerdict');
    const scoreText = document.getElementById('uiScore');

    if (score < 60) {
        master.className = "score-master-card danger";
        verdict.innerText = "VERDICT: LOGICAL EVASION DETECTED (一票否決 / 邏輯零交集)";
        scoreText.className = "score-display danger-text";
        alert('🚨 AUDIT ALERT: 偵測到嚴重語意偏離，可靠性分數降為 0！');
    } else {
        master.className = "score-master-card success";
        verdict.innerText = "VERDICT: RELIABILITY PASSED (對頻過關)";
        scoreText.className = "score-display success-text";
    }
}
</script>

</body>
</html>
